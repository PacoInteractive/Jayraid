<body class="admin">
<!-- Nur fuer Tixx: zeigt, was Besucher Bubbles gefragt haben und er nicht wusste. -->
<main class="admin-main">
  <h1>Unbeantwortete Fragen</h1>
  <p class="small">Was Besucher Bubbles gefragt haben und er nicht beantworten konnte, häufigste zuerst. Gute Kandidaten für <code>bubbles-faq.md</code>.
    Gespeichert ist nur die Frage selbst, nichts über die Person.</p>
  <form class="admin-login" id="login">
    <input type="password" id="token" placeholder="ADMIN_TOKEN" autocomplete="off" aria-label="Admin-Passwort">
    <button class="button" type="submit">Anzeigen</button>
  </form>
  <p class="small" id="status"></p>
  <div class="panel admin-list" id="list" hidden></div>
</main>
<script src="../../assets/config.js"></script>
<script src="fragen.js"></script>
